<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Travel Planner - Simple Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        'primary-hover': '#4F46E5',
                        background: '#F8FAFC',
                        surface: '#FFFFFF',
                        'text-primary': '#0F172A',
                        'text-secondary': '#64748B',
                        border: '#E2E8F0',
                        success: '#10B981',
                        error: '#EF4444',
                        warning: '#F59E0B',
                        info: '#3B82F6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen">
    <!-- Network status banner (hidden by default) -->
    <div id="networkBanner" class="hidden fixed top-0 left-0 right-0 z-50 text-white px-4 py-3 shadow-lg flex items-center justify-between">
        <span id="networkBannerText"></span>
        <button id="networkBannerBtn" class="ml-4 px-3 py-1 bg-white/20 hover:bg-white/30 rounded text-sm font-medium transition-all duration-200">Dismiss</button>
    </div>

    <div class="container mx-auto px-4 py-10 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-text-primary mb-3">
                ✈️ Smart Travel Planner
            </h1>
            <p class="text-text-secondary text-lg">
                AI-powered travel planning with real-time weather insights
            </p>
            <p class="text-sm text-text-secondary mt-2">
                Simple HTML Demo - No Build Required
            </p>
        </div>

        <!-- Form Card -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-8 mb-8 hover:shadow-md transition-shadow duration-200">
            <form id="travelForm">
                <div class="grid md:grid-cols-2 gap-5 mb-6">
                    <!-- Destination Input -->
                    <div>
                        <label class="block text-sm font-medium text-text-primary mb-2">
                            📍 Destination
                        </label>
                        <input
                            id="destination"
                            type="text"
                            placeholder="e.g., Tokyo, Paris, New York"
                            class="w-full px-4 py-2.5 border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-text-primary placeholder:text-text-secondary"
                        />
                    </div>

                    <!-- Travel Dates Input -->
                    <div>
                        <label class="block text-sm font-medium text-text-primary mb-2">
                            📅 Travel Dates
                        </label>
                        <input
                            id="travelDates"
                            type="text"
                            placeholder="e.g., May 15-20, 2026"
                            class="w-full px-4 py-2.5 border border-border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-text-primary placeholder:text-text-secondary"
                        />
                    </div>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-primary hover:bg-primary-hover disabled:bg-slate-300 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 hover:shadow-md"
                >
                    Generate Travel Guide
                </button>
            </form>
        </div>

        <!-- Status Display -->
        <div id="statusBox" class="hidden bg-indigo-50 border-l-4 border-primary p-4 mb-5 rounded-lg">
            <div class="flex items-center">
                <svg class="animate-spin w-5 h-5 text-primary mr-3" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p id="statusText" class="text-indigo-700 font-medium"></p>
            </div>
        </div>

        <!-- Tool Calls Display -->
        <div id="toolCallsBox" class="hidden bg-surface border border-border p-5 mb-5 rounded-xl shadow-sm">
            <h3 class="font-semibold text-text-primary mb-3">🔧 AI Actions:</h3>
            <div id="toolCallsList"></div>
        </div>

        <!-- Error Display -->
        <div id="errorBox" class="hidden bg-red-50 border-2 border-error/30 p-5 mb-5 rounded-xl shadow-sm">
            <div class="flex items-start gap-3">
                <span class="text-error text-xl flex-shrink-0 mt-0.5">⚠️</span>
                <div class="flex-1">
                    <div id="errorText" class="text-text-primary"></div>
                    <div id="errorActions"></div>
                </div>
            </div>
        </div>

        <!-- Result Display -->
        <div id="resultBox" class="hidden bg-surface rounded-xl shadow-sm border border-border p-8 hover:shadow-md transition-shadow duration-200">
            <h2 class="text-2xl font-bold text-text-primary mb-4 flex items-center">
                <span class="text-success mr-2">✓</span>
                Your Travel Guide
            </h2>
            <div class="prose prose-sm max-w-none">
                <pre id="resultText" class="whitespace-pre-wrap font-sans text-text-primary leading-relaxed"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/travel/stream';
        const REQUEST_TIMEOUT = 30000;
        const HEARTBEAT_TIMEOUT = 60000;

        let isStreaming = false;
        let abortController = null;
        let requestTimeoutId = null;
        let heartbeatTimeoutId = null;
        let lastRequestData = null;

        const elements = {
            form: document.getElementById('travelForm'),
            submitBtn: document.getElementById('submitBtn'),
            destination: document.getElementById('destination'),
            travelDates: document.getElementById('travelDates'),
            statusBox: document.getElementById('statusBox'),
            statusText: document.getElementById('statusText'),
            toolCallsBox: document.getElementById('toolCallsBox'),
            toolCallsList: document.getElementById('toolCallsList'),
            errorBox: document.getElementById('errorBox'),
            errorText: document.getElementById('errorText'),
            errorActions: document.getElementById('errorActions'),
            resultBox: document.getElementById('resultBox'),
            resultText: document.getElementById('resultText'),
            networkBanner: document.getElementById('networkBanner'),
            networkBannerText: document.getElementById('networkBannerText'),
            networkBannerBtn: document.getElementById('networkBannerBtn')
        };

        // ── Network online/offline detection ──
        function updateNetworkBanner() {
            if (!navigator.onLine) {
                elements.networkBanner.className = 'fixed top-0 left-0 right-0 z-50 bg-error text-white px-4 py-3 shadow-lg flex items-center justify-between';
                elements.networkBannerText.textContent = 'No internet connection — please check your network.';
                elements.networkBannerBtn.textContent = 'Dismiss';
                elements.networkBannerBtn.onclick = () => elements.networkBanner.classList.add('hidden');
                elements.networkBanner.classList.remove('hidden');
            } else {
                elements.networkBanner.classList.add('hidden');
            }
        }
        window.addEventListener('online', () => {
            elements.networkBanner.className = 'fixed top-0 left-0 right-0 z-50 bg-success text-white px-4 py-3 shadow-lg flex items-center justify-between';
            elements.networkBannerText.textContent = 'Back online — connection restored.';
            elements.networkBannerBtn.textContent = 'OK';
            elements.networkBannerBtn.onclick = () => elements.networkBanner.classList.add('hidden');
            elements.networkBanner.classList.remove('hidden');
            setTimeout(() => elements.networkBanner.classList.add('hidden'), 3000);
        });
        window.addEventListener('offline', updateNetworkBanner);

        // ── UI helpers ──
        function hideAllBoxes() {
            elements.statusBox.classList.add('hidden');
            elements.toolCallsBox.classList.add('hidden');
            elements.errorBox.classList.add('hidden');
            elements.resultBox.classList.add('hidden');
            elements.toolCallsList.innerHTML = '';
        }

        function showStatus(message) {
            elements.statusText.textContent = message;
            elements.statusBox.classList.remove('hidden');
        }

        function addToolCall(tool, args) {
            elements.toolCallsBox.classList.remove('hidden');
            const div = document.createElement('div');
            div.className = 'text-sm text-text-secondary mb-1.5 flex items-center gap-2';
            div.innerHTML = `<span class="text-success">✓</span> Called <code class="bg-indigo-50 text-primary px-2 py-0.5 rounded text-xs font-medium">${tool}</code>${args.city ? ` for ${args.city}` : ''}`;
            elements.toolCallsList.appendChild(div);
        }

        function showError(message, opts = {}) {
            const { showReconnect = false, title = 'Error' } = opts;

            elements.errorBox.classList.remove('hidden');
            elements.errorText.innerHTML =
                `<strong class="block text-text-primary text-base mb-1">${title}</strong>` +
                `<span class="text-sm text-text-secondary">${message}</span>`;

            elements.errorActions.innerHTML = '';
            if (showReconnect && lastRequestData) {
                const btn = document.createElement('button');
                btn.textContent = 'Reconnect';
                btn.className = 'mt-3 inline-flex items-center gap-2 px-4 py-2 bg-error hover:bg-red-600 text-white rounded-lg font-medium transition-all duration-200 text-sm hover:shadow-md';
                btn.addEventListener('click', () => {
                    startStream(lastRequestData.destination, lastRequestData.travelDates);
                });
                elements.errorActions.appendChild(btn);
            }
        }

        function showResult(content) {
            elements.resultText.textContent = content;
            elements.resultBox.classList.remove('hidden');
        }

        // ── Timer helpers ──
        function clearAllTimers() {
            if (requestTimeoutId) { clearTimeout(requestTimeoutId); requestTimeoutId = null; }
            if (heartbeatTimeoutId) { clearTimeout(heartbeatTimeoutId); heartbeatTimeoutId = null; }
        }

        function resetHeartbeat() {
            if (heartbeatTimeoutId) clearTimeout(heartbeatTimeoutId);
            heartbeatTimeoutId = setTimeout(() => {
                if (abortController) abortController.abort();
                resetUI();
                showError(
                    'The server stopped responding. The connection may have been lost.',
                    { showReconnect: true, title: 'Connection Lost' }
                );
            }, HEARTBEAT_TIMEOUT);
        }

        function resetUI() {
            isStreaming = false;
            elements.submitBtn.disabled = false;
            elements.submitBtn.textContent = 'Generate Travel Guide';
            elements.statusBox.classList.add('hidden');
            clearAllTimers();
        }

        // ── Core streaming logic ──
        async function startStream(destination, travelDates) {
            if (isStreaming) return;

            if (!navigator.onLine) {
                showError('You are offline. Please check your internet connection and try again.',
                    { showReconnect: true, title: 'Network Unavailable' });
                return;
            }

            isStreaming = true;
            lastRequestData = { destination, travelDates };
            hideAllBoxes();
            elements.submitBtn.disabled = true;
            elements.submitBtn.textContent = 'Planning Your Trip...';

            abortController = new AbortController();

            requestTimeoutId = setTimeout(() => {
                if (abortController) abortController.abort();
                resetUI();
                showError(
                    `The request timed out after ${REQUEST_TIMEOUT / 1000} seconds. The server may be overloaded or unreachable.`,
                    { showReconnect: true, title: 'Request Timeout' }
                );
            }, REQUEST_TIMEOUT);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination, travel_dates: travelDates }),
                    signal: abortController.signal
                });

                if (requestTimeoutId) { clearTimeout(requestTimeoutId); requestTimeoutId = null; }

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                resetHeartbeat();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    resetHeartbeat();

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.trim()) continue;

                        const eventMatch = line.match(/^event: (.+)$/m);
                        const dataMatch = line.match(/^data: (.+)$/m);

                        if (eventMatch && dataMatch) {
                            const eventType = eventMatch[1];
                            let data;
                            try {
                                data = JSON.parse(dataMatch[1]);
                            } catch (parseErr) {
                                showError(
                                    `Received malformed data from server: ${parseErr.message}`,
                                    { title: 'Data Error' }
                                );
                                continue;
                            }

                            switch (eventType) {
                                case 'status':
                                    showStatus(data.message);
                                    break;
                                case 'tool_call':
                                    addToolCall(data.tool, data.args);
                                    break;
                                case 'result':
                                    showResult(data.content);
                                    break;
                                case 'error':
                                    showError(data.error, { showReconnect: true, title: 'Server Error' });
                                    break;
                                case 'done':
                                    showStatus('Travel guide generated successfully!');
                                    break;
                            }
                        }
                    }
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    return;
                }
                const isNetworkError = err instanceof TypeError;
                showError(
                    isNetworkError
                        ? 'Unable to reach the server. Please make sure the backend is running on localhost:8000.'
                        : err.message,
                    {
                        showReconnect: true,
                        title: isNetworkError ? 'Connection Failed' : 'Error'
                    }
                );
            } finally {
                resetUI();
            }
        }

        elements.form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isStreaming) return;

            const destination = elements.destination.value.trim();
            const travelDates = elements.travelDates.value.trim();

            if (destination && travelDates) {
                startStream(destination, travelDates);
            }
        });
    </script>
</body>
</html>
