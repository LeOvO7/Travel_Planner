<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Test - Smart Travel Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #f8fafc;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .info {
            color: #64748b;
            margin-bottom: 20px;
        }

        .status {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status.loading {
            background: #e0e7ff;
            color: #4338ca;
            border: 1px solid #a5b4fc;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .map-container {
            width: 100%;
            height: 600px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: #6366f1;
            color: white;
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-secondary {
            background: white;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .legend {
            margin-top: 16px;
            padding: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: inline-block;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            color: #475569;
            font-size: 13px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .api-key-info {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #78350f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Google Maps API Test</h1>
        <p class="info">Testing Google Maps integration for Smart Travel Planner</p>

        <div id="api-key-status" class="api-key-info"></div>

        <div id="status" class="status loading">
            ⏳ Initializing Google Maps API...
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="addSampleMarkers()">
                Add Sample Markers
            </button>
            <button class="btn-secondary" onclick="goToNewYork()">
                Go to New York
            </button>
            <button class="btn-secondary" onclick="goToTokyo()">
                Go to Tokyo
            </button>
            <button class="btn-secondary" onclick="goToLondon()">
                Go to London
            </button>
            <button class="btn-secondary" onclick="clearMarkers()">
                Clear Markers
            </button>
        </div>

        <div class="legend">
            <div class="legend-title">Map Legend</div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #6366f1;"></div>
                <span>Hotels</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #10b981;"></div>
                <span>Restaurants</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #f59e0b;"></div>
                <span>Attractions</span>
            </div>
        </div>
    </div>

    <script>
        // Replace this with your actual Google Maps API key
        const API_KEY = 'AIzaSyB2Mo8gdkO3-35tsmrf_WlBrSkTbUKYp9Q';

        let map;
        let markers = [];
        let infoWindow;

        // Show API key status
        document.getElementById('api-key-status').innerHTML =
            API_KEY ?
            '✅ API Key loaded: ' + API_KEY.substring(0, 20) + '...' :
            '❌ No API Key found! Please update the API_KEY variable in this file.';

        // Load Google Maps API
        function loadGoogleMaps() {
            return new Promise((resolve, reject) => {
                if (!API_KEY) {
                    reject(new Error('API Key not configured'));
                    return;
                }

                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,geometry`;
                script.async = true;
                script.defer = true;

                script.onload = () => {
                    console.log('✅ Google Maps API loaded successfully');
                    resolve();
                };

                script.onerror = (error) => {
                    console.error('❌ Failed to load Google Maps API:', error);
                    reject(new Error('Failed to load Google Maps script'));
                };

                document.head.appendChild(script);
            });
        }

        // Initialize map
        function initMap() {
            const statusEl = document.getElementById('status');

            try {
                // Create map instance
                map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 40.7128, lng: -74.0060 }, // New York City
                    zoom: 13,
                    disableDefaultUI: false,
                    zoomControl: true,
                    mapTypeControl: true,
                    streetViewControl: true,
                    fullscreenControl: true
                });

                // Create info window
                infoWindow = new google.maps.InfoWindow();

                statusEl.className = 'status success';
                statusEl.textContent = '✅ Google Maps loaded successfully! Click "Add Sample Markers" to test markers.';

                console.log('✅ Map initialized successfully');

            } catch (error) {
                console.error('❌ Error initializing map:', error);
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Error initializing map: ' + error.message;
            }
        }

        // Create a marker
        function createMarker(place) {
            const svgIcon = `
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="15" fill="${place.color}" stroke="white" stroke-width="3"/>
                    <text x="18" y="23" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="monospace">${place.id}</text>
                </svg>
            `.trim();

            const icon = {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svgIcon),
                scaledSize: new google.maps.Size(36, 36),
                anchor: new google.maps.Point(18, 18)
            };

            const marker = new google.maps.Marker({
                position: { lat: place.lat, lng: place.lng },
                map: map,
                icon: icon,
                title: place.name,
                optimized: false
            });

            // Add click listener
            marker.addListener('click', () => {
                const content = `
                    <div style="padding: 8px; min-width: 180px;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 4px;">${place.name}</div>
                        <div style="font-size: 12px; color: #64748B; margin-bottom: 4px;">${place.type}</div>
                        ${place.rating ? `<div style="font-size: 12px;"><span style="color: #F59E0B;">★</span> ${place.rating}/5</div>` : ''}
                    </div>
                `;
                infoWindow.setContent(content);
                infoWindow.open(map, marker);
            });

            return marker;
        }

        // Add sample markers (New York locations)
        function addSampleMarkers() {
            clearMarkers();

            const samplePlaces = [
                {
                    id: 1,
                    name: 'Times Square Hotel',
                    type: 'Hotel',
                    lat: 40.7580,
                    lng: -73.9855,
                    color: '#6366f1',
                    rating: 4.5
                },
                {
                    id: 2,
                    name: 'Central Park Restaurant',
                    type: 'Restaurant',
                    lat: 40.7829,
                    lng: -73.9654,
                    color: '#10b981',
                    rating: 4.7
                },
                {
                    id: 3,
                    name: 'Statue of Liberty',
                    type: 'Attraction',
                    lat: 40.6892,
                    lng: -74.0445,
                    color: '#f59e0b',
                    rating: 4.9
                },
                {
                    id: 4,
                    name: 'Brooklyn Bridge Hotel',
                    type: 'Hotel',
                    lat: 40.7061,
                    lng: -73.9969,
                    color: '#6366f1',
                    rating: 4.3
                },
                {
                    id: 5,
                    name: 'Empire State Building',
                    type: 'Attraction',
                    lat: 40.7484,
                    lng: -73.9857,
                    color: '#f59e0b',
                    rating: 4.8
                }
            ];

            samplePlaces.forEach(place => {
                const marker = createMarker(place);
                markers.push(marker);
            });

            // Fit bounds to show all markers
            const bounds = new google.maps.LatLngBounds();
            samplePlaces.forEach(place => {
                bounds.extend({ lat: place.lat, lng: place.lng });
            });
            map.fitBounds(bounds, 50);

            const statusEl = document.getElementById('status');
            statusEl.className = 'status success';
            statusEl.textContent = `✅ Added ${samplePlaces.length} sample markers to the map`;
        }

        // Clear all markers
        function clearMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            const statusEl = document.getElementById('status');
            statusEl.className = 'status success';
            statusEl.textContent = '🗑️ All markers cleared';
        }

        // Navigate to different cities
        function goToNewYork() {
            map.setCenter({ lat: 40.7128, lng: -74.0060 });
            map.setZoom(13);
        }

        function goToTokyo() {
            map.setCenter({ lat: 35.6762, lng: 139.6503 });
            map.setZoom(13);
        }

        function goToLondon() {
            map.setCenter({ lat: 51.5074, lng: -0.1278 });
            map.setZoom(13);
        }

        // Initialize on page load
        (async () => {
            try {
                await loadGoogleMaps();
                initMap();
            } catch (error) {
                console.error('❌ Failed to initialize:', error);
                const statusEl = document.getElementById('status');
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Failed to load Google Maps: ' + error.message;
            }
        })();
    </script>
</body>
</html>
